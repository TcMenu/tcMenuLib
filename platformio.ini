[env]
framework = arduino

lib_deps =
    SPI
    tcmenu/IoAbstraction
    tcmenu/tcUnicodeHelper
    tcmenu/LiquidCrystalIO
    bodmer/TFT_eSPI
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
    adafruit/Adafruit FT6206 Library

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560

lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit PCD8544 Nokia 5110 LCD library
    uipethernet/UIPEthernet
    adafruit/Adafruit ST7735 and ST7789 Library
    greiman/SSD1306Ascii

[env:esp32dev]
platform = espressif32
board = esp32dev

lib_deps =
    ${env.lib_deps}
    FS
    SPIFFS
    olikraus/U8g2
    adafruit/Adafruit ILI9341
    adafruit/Adafruit ST7735 and ST7789 Library

[env:esp01_1m]
platform = espressif8266
board = esp01_1m

lib_deps =
    ${env.lib_deps}
    ESP8266WiFi
    olikraus/U8g2
